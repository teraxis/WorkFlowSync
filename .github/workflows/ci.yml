name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WorkFlowSync.sln

      - name: Build
        run: dotnet build WorkFlowSync.sln --no-restore --nologo -warnaserror

      - name: Test
        run: dotnet test WorkFlowSync.sln --no-build --nologo

      - name: Publish portable exe
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\publish.ps1

      - name: Smoke
        run: .\publish\portable\wfs.exe config validate --config config.example.json

